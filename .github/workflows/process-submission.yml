name: Process Skin Submission

on:
  issues:
    types: [opened, labeled, edited]

jobs:
  process:
    # Trigger on new issues with the submit template, or when 'skin-submission' label is added
    if: |
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, 'submitted') &&
      ((github.event.action == 'labeled' && github.event.label.name == 'skin-submission') ||
       (contains(github.event.issue.body, '### Skin URL') &&
        (github.event.action == 'opened' ||
         (github.event.action == 'edited' && github.event.changes.body.from != null &&
          github.event.sender.login == github.event.issue.user.login))))
    runs-on: ubuntu-latest
    concurrency:
      group: skin-submission-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add processing label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['processing']
            });

      - name: Extract submission URL from issue
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // Match ### Skin URL\n<url> or ### Repo URL\n<url>
            const urlMatch = body.match(/###\s+(?:Skin|Repo|Metadata)\s+URL\s*\n+([^\s\n]+)/i);
            const url = urlMatch ? urlMatch[1].trim() : '';
            const submitter = context.payload.issue.user.login;
            core.setOutput('url', url);
            core.setOutput('submitter', submitter);
            if (!url) {
              core.setFailed('Could not extract URL from issue body');
            }

      - name: Process submission
        id: process
        # The URL and submitter come from issue text. They go through env:,
        # never ${{ }} inside run:, so shell metacharacters stay data.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_URL: ${{ steps.extract.outputs.url }}
          SUBMITTER: ${{ steps.extract.outputs.submitter }}
        run: |
          python3 scripts/process_submission.py \
            --review-collections \
            --output-dir skins/ \
            --github-token "$GITHUB_TOKEN" \
            --submitted-by "$SUBMITTER" \
            -- "$SUBMISSION_URL"

      - name: Commit and push
        id: push
        if: steps.process.outputs.collection_review != 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skins/ variants.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit"
          else
            git commit -m "feat(skins): add submission from issue #$ISSUE_NUMBER"
            git pull --rebase origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the catalog
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-catalog.yml --ref main

      - name: Update the submission issue
        uses: actions/github-script@v7
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
          BLOCKED: ${{ steps.process.outputs.blocked }}
          COLLECTION: ${{ steps.process.outputs.collection_review }}
        with:
          script: |
            const pushed = process.env.PUSHED === 'true';
            const blocked = process.env.BLOCKED === 'true';
            const collection = process.env.COLLECTION === 'true';
            const body = collection
              ? 'This link points to a collection. A maintainer will review it before publishing. Please add the release tags or folder to import, which layouts and colorways to include, and whether this replaces an existing source. Keep the details here.'
              : blocked
              ? `This repo has opted out of EmuSkins, so its skins can't be added. If you think that's a mistake, say so here and a maintainer will look.`
              : pushed
              ? `The submission was accepted. It will appear after the catalog rebuild.`
              : `⚠️ Submission was processed but no new skins were found (they may already be in the catalog).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            // Remove processing label, add submitted
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'processing'
            }).catch(() => {});
            if (pushed || blocked) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['submitted']
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: blocked ? 'not_planned' : 'completed'
              });
            }

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Submission failed to process.**\n\nYou can edit this issue to retry. Please check that:\n- The URL is publicly accessible\n- It points to a \`.deltaskin\`, \`.manicskin\`, GitHub repo, or GitHub release\n\nSee the [workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions) for details, or submit a manual PR.`
            });
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'processing'
            }).catch(() => {});
