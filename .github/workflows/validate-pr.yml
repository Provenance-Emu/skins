name: Validate PR

on:
  pull_request:
    paths:
      - "skins/**/*.json"
      - "creators/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get changed skin files
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files: "skins/**/*.json"

      # Every changed file gets schema validation. The live URL check runs only
      # where the PR touches the download link: added files, and modified files
      # whose downloadURL differs from the base branch. A change that leaves the
      # link alone (a rename, a metadata backfill) shouldn't fail on a link that
      # died upstream — link_health.py hides those.
      #
      # File lists come in through env, never interpolated into the script, so
      # a crafted filename can't inject shell.
      - name: Validate changed files
        if: steps.changed.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          ADDED_FILES: ${{ steps.changed.outputs.added_files }}
          MODIFIED_FILES: ${{ steps.changed.outputs.modified_files }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Validating: $ALL_CHANGED_FILES"
          for f in $ALL_CHANGED_FILES; do
            python3 scripts/validate_skin.py "$f"
          done

          # Modified files whose downloadURL changed versus the PR base.
          URL_CHANGED=$(python3 - <<'PY'
          import json, os, subprocess

          base = "origin/" + os.environ["BASE_REF"]

          def url(text):
              try:
                  return json.loads(text).get("downloadURL")
              except (ValueError, AttributeError):
                  return None

          for f in os.environ.get("MODIFIED_FILES", "").split():
              old = subprocess.run(["git", "show", f"{base}:{f}"],
                                   capture_output=True, text=True)
              if old.returncode != 0:
                  print(f)  # not on base: treat as new
                  continue
              with open(f) as fh:
                  if url(old.stdout) != url(fh.read()):
                      print(f)
          PY
          )

          for f in $ADDED_FILES $URL_CHANGED; do
            python3 scripts/validate_skin.py "$f" --check-url
          done

      # Schema for every creator file the PR adds, changes or deletes, plus who
      # may do so: the file's githubLogin on the base branch, or a CODEOWNERS
      # maintainer (see scripts/validate_creator.py). Values come in through env.
      - name: Validate creator profiles
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/validate_creator.py --diff-base "origin/$BASE_REF" --pr-author "$PR_AUTHOR"

      - name: Check for duplicate IDs across full catalog
        run: python3 scripts/build_catalog.py --check-only

      - name: Post PR comment on failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ❌ **Skin validation failed.** Please check the workflow logs for details.

            Common issues:
            - Missing required fields (`id`, `name`, `systems`, `downloadURL`, `source`)
            - `id` must be exactly 16 lowercase hex characters
            - `downloadURL` must end in `.deltaskin` or `.manicskin`
            - `systems` must contain valid system codes (`gba`, `gbc`, `nes`, `snes`, `n64`, `nds`, `genesis`, `unofficial`)
            - Duplicate `id` already exists in the catalog

            For `creators/<slug>.json`: see the checks listed in the logs (schema, an alias already
            claimed by another profile, or a PR author who is not the profile's `githubLogin`).
