name: Codex repair

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_run:
    workflows: [Tests, Build Catalog & Deploy Site, Generate Thumbnails, Link Health, Crawl External Sources, Skins Site Audit]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue or PR number to fix
        required: true
        type: string

permissions: {}

concurrency:
  group: codex-repair-${{ github.event.issue.number || github.event.inputs.issue_number || github.event.workflow_run.workflow_id || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.context.outputs.run }}
      branch: ${{ steps.context.outputs.branch }}
      base: ${{ steps.context.outputs.base }}
      sha: ${{ steps.base.outputs.sha }}
      title: ${{ steps.context.outputs.title }}
      source: ${{ steps.context.outputs.source }}
      issue: ${{ steps.context.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Authorize trigger and collect issue / failure logs
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const { prepare } = require('./.github/scripts/codex-context.cjs');
            await prepare({ github, context, core });
      - name: Record trusted base
        id: base
        if: steps.context.outputs.run == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.context.outputs.run == 'true'
        with:
          name: codex-context
          path: ${{ runner.temp }}/codex-prompt.txt
          retention-days: 3

  repair:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check API key configuration
        env:
          HAS_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_API_KEY" != true ]; then
            echo '::error::Add an OPENAI_API_KEY Actions secret for this repository (or grant it access to an organization secret). No Codex cloud environment is needed.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: codex-context
          path: ${{ runner.temp }}/codex-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: pip install pytest Pillow
      - name: Prepare result directory
        run: mkdir -p "$RUNNER_TEMP/codex-result"
      - name: Generate and verify repair
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-context/codex-prompt.txt
          output-file: ${{ runner.temp }}/codex-result/summary.txt
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-bots: true
      - name: Capture patch (no write token in this job)
        run: |
          mkdir -p "$RUNNER_TEMP/codex-result"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/codex-result/repair.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-repair
          path: ${{ runner.temp }}/codex-result/
          retention-days: 7

  publish:
    needs: [prepare, repair]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # A fresh job publishes data only; it never executes agent-edited code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: codex-repair
          path: ${{ runner.temp }}/codex-result
      - name: Apply patch and prepare PR description
        id: patch
        env:
          SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          if [ ! -s "$RUNNER_TEMP/codex-result/repair.patch" ]; then
            echo 'No changes proposed. See the codex-repair artifact for the diagnosis.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git apply --index "$RUNNER_TEMP/codex-result/repair.patch"
          printf 'Repair for %s\n\n' "$SOURCE" > "$RUNNER_TEMP/codex-result/body.txt"
          cat "$RUNNER_TEMP/codex-result/summary.txt" >> "$RUNNER_TEMP/codex-result/body.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Open repair PR
        id: pr
        if: steps.patch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          base: ${{ needs.prepare.outputs.base }}
          branch: ${{ needs.prepare.outputs.branch }}
          title: ${{ needs.prepare.outputs.title }}
          body-path: ${{ runner.temp }}/codex-result/body.txt
          commit-message: 'fix: apply Codex repair'
          draft: true
      - name: Report result on the issue
        if: needs.prepare.outputs.issue != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const body = process.env.PR_URL
              ? `Proposed repair: ${process.env.PR_URL}. Review the draft and mark it ready to run PR checks.`
              : fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'codex-result/summary.txt'), 'utf8').slice(0, 30000);
            await github.rest.issues.createComment({ ...context.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body });
