name: Tests

on:
  push:
    branches: [main]
    paths:
      - "docs/js/**"
      - "docs/retroarch.html"
      - "docs/submit.html"
      - "scripts/**"
      - "tests/**"
      - "fixtures/**"
  pull_request:
    paths:
      - "docs/js/**"
      - "docs/retroarch.html"
      - "docs/submit.html"
      - "scripts/**"
      - "tests/**"
      - "fixtures/**"
      - "skins/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest pytest-cov Pillow

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

      - name: Validate full catalog integrity
        run: python3 scripts/build_catalog.py --check-only

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # The shared client-side skin stack (docs/js/skin/): zip, info, validate, source and inputs under Node,
  # with fixtures/variants and fixtures/merge as inputs. validate.js is held to the same expected verdicts
  # as link_health.py (tests/fixtures/skin-stack/validate-cases.json; the Python side runs in `test`).
  skin-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JSZip
        working-directory: tests/js
        run: npm ci

      - name: Test the skin stack
        working-directory: tests/js
        run: npm test

  # docs/retroarch.html end to end in Chromium and WebKit (tests/browser/retroarch.cjs).
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Test the RetroArch converter page
        run: |
          python3 -m http.server 8765 --directory docs > /tmp/emuskins-http.log 2>&1 &
          trap 'kill $!' EXIT
          for _ in $(seq 1 30); do
            curl --silent --fail http://localhost:8765/retroarch.html > /dev/null && break
            sleep 1
          done
          npm test --prefix tests/browser
