name: Tests

on:
  push:
    branches: [main]
    paths:
      - "docs/js/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - "docs/js/**"
      - "scripts/**"
      - "tests/**"
      - "skins/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest pytest-cov Pillow

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test RetroArch conversion
        run: node --test tests/js/retroarch.test.mjs

      - name: Validate full catalog integrity
        run: python3 scripts/build_catalog.py --check-only

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm install
          npx playwright install --with-deps chromium webkit
      - name: Test converter in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --directory docs > /tmp/emuskins-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8765/convert.html > /dev/null; then break; fi
            sleep 1
          done
          npm test --prefix tests/browser
