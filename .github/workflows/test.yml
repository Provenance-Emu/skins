name: Tests

on:
  push:
    branches: [main]
    paths:
      - "docs/js/**"
      - "docs/retroarch.html"
      - "docs/submit.html"
      - "docs/edit.html"
      - "scripts/**"
      - "tests/**"
      - ".github/**"
      - "fixtures/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/js/**"
      - "docs/retroarch.html"
      - "docs/submit.html"
      - "docs/edit.html"
      - "scripts/**"
      - "tests/**"
      - ".github/**"
      - "fixtures/**"
      - "skins/**"
      - "badges.json"
      - "disputed.json"

permissions:
  contents: read

jobs:
  agent-tests:
    name: Codex trigger tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/codex-context.test.cjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest pytest-cov Pillow

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

      - name: Validate full catalog integrity
        run: python3 scripts/build_catalog.py --check-only

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # The shared client-side skin stack (docs/js/skin/): zip, info, validate, source and inputs under Node,
  # plus the editor's pure modules (docs/js/editor/: undo stack, snapping, frame math, patching, export; tests/js/editor),
  # with fixtures/variants and fixtures/merge as inputs. validate.js is held to the same expected verdicts
  # as link_health.py (tests/fixtures/skin-stack/validate-cases.json; the Python side runs in `test`).
  skin-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JSZip
        working-directory: tests/js
        run: npm ci

      - name: Test the skin stack
        working-directory: tests/js
        run: npm test

  # Skin format 2.0 renderer (docs/js/skin2/, SkinKit#93): TypeScript compiled with tsc (the .js next to each .ts is
  # committed, as the site has no build step), then the vendored SkinKit fixtures (fixtures/format2/, checked against
  # MANIFEST.json) resolved and rendered headlessly and compared with SkinKit's recorded layout.json files (exactly)
  # and 2x reference PNGs (pixelmatch, section 9.3 tolerances). Failing renders upload their actual and diff images.
  skin2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/checkout@v4
        with:
          repository: Provenance-Emu/SkinKit
          ref: main
          path: .skinkit-reference
          persist-credentials: false
          sparse-checkout: |
            Tests/Format2Fixtures
            Sources/SkinKit2Core/Resources/parts

      - name: Check vendored fixtures and standard parts against SkinKit main
        env:
          SKIN2_REFERENCE: .skinkit-reference
        run: node tests/skin2/check-upstream.mjs

      - name: Install the test dependencies
        working-directory: tests/skin2
        run: npm ci

      - name: Type-check and compile
        working-directory: tests/skin2
        run: npm run build

      - name: The committed JavaScript is what tsc emits
        run: git diff --exit-code -- docs/js/skin2

      - name: Test the skin 2.0 renderer
        working-directory: tests/skin2
        env:
          SKIN2_FAILURES: ${{ runner.temp }}/skin2-render-failures
        run: node --test "*.test.js"

      - name: Upload the diff images of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skin2-render-failures
          path: ${{ runner.temp }}/skin2-render-failures
          if-no-files-found: ignore

  # docs/retroarch.html, docs/submit.html and docs/edit.html end to end in Chromium and WebKit
  # (tests/browser/retroarch.cjs, submit.cjs, editor.cjs).
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Test the pages in browsers
        run: |
          python3 -m http.server 8765 --directory docs > /tmp/emuskins-http.log 2>&1 &
          trap 'kill $!' EXIT
          for _ in $(seq 1 30); do
            curl --silent --fail http://localhost:8765/retroarch.html > /dev/null && break
            sleep 1
          done
          npm test --prefix tests/browser
