name: Build Catalog & Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "skins/**"
      - "link-health.json"
      - "blocklist.json"
      - "scripts/blocklist.py"
      - "variants.json"
      - "added-dates.json"
      - "badges.json"
      - "badge-dates.json"
      - "disputed.json"
      - "creators/**"
      - "docs/**"
      - "scripts/build_catalog.py"
      - "scripts/link_health.py"
      - "scripts/skin_schema.py"
      - "scripts/added_dates.py"
      - "scripts/creator_policy.py"
      - "scripts/creator_directory.py"
      - "scripts/compute_creator_stats.py"
      - "scripts/disputed.py"
      - "scripts/creator_pages.py"
      - "scripts/creator_profile_html.py"
      - "scripts/compute_creator_stats.py"
      - "scripts/disputed.py"
      - "scripts/variants_sidecar.py"
      - "scripts/generate_system_pages.py"
      - "scripts/generate_author_pages.py"
      - "scripts/generate_share_cards.py"
      - "scripts/generate_skin_pages.py"
      - "scripts/generate_sitemap.py"
      - "scripts/generate_rss.py"
      - "scripts/share_meta.py"
      - "scripts/assets/**"
      - "scripts/build_site.sh"
      - "scripts/publish_site.sh"
      - ".github/workflows/build-catalog.yml"
  workflow_dispatch:
    inputs:
      accept_count_jumps:
        description: "Publish thumbnail view counts that rose more than 10x since the last build now (normally held for one build)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the tip of main, not the commit that triggered this run.
      # Runs are serialized by the `pages` concurrency group, so a run that
      # queued behind another one would otherwise build a stale commit and
      # have its rebuild push rejected as non-fast-forward.
      # Full history: addedAt is each skin file's first-commit date, and in a
      # shallow clone git reports the single grafted commit as adding everything
      # (scripts/added_dates.py refuses to cache that, but the dates would be missing).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (share cards and image sizes in page tags)
        run: pip install Pillow

      - name: Build and publish from the latest main (retry concurrent updates)
        env:
          ACCEPT_COUNT_JUMPS: ${{ inputs.accept_count_jumps }}
        run: bash scripts/publish_site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --repo ${{ github.repository }} \
            --label "workflow-failure" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Workflow-failure issue #$EXISTING already open — adding this run to it"
            gh issue comment "$EXISTING" --repo ${{ github.repository }} \
              --body "Failed again: run ${{ github.run_number }} ($RUN_URL), trigger \`${{ github.event_name }}\`, commit ${{ github.sha }}."
            exit 0
          fi
          gh issue create \
            --repo ${{ github.repository }} \
            --title "🚨 Build Catalog workflow failed (run ${{ github.run_number }})" \
            --body "The **Build Catalog & Deploy Site** workflow failed.

          **Run:** $RUN_URL
          **Trigger:** \`${{ github.event_name }}\`
          **Commit:** ${{ github.sha }}

          Please investigate the failed step in the run logs. Later failures are added to this issue as comments while it stays open." \
            --assignee JoeMatt \
            --label "bug,workflow-failure"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
