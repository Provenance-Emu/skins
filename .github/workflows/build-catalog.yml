name: Build Catalog & Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "skins/**"
      - "link-health.json"
      - "blocklist.json"
      - "scripts/blocklist.py"
      - "variants.json"
      - "added-dates.json"
      - "creators/**"
      - "docs/**"
      - "scripts/build_catalog.py"
      - "scripts/link_health.py"
      - "scripts/skin_schema.py"
      - "scripts/added_dates.py"
      - "scripts/creator_policy.py"
      - "scripts/creator_directory.py"
      - "scripts/variants_sidecar.py"
      - "scripts/generate_system_pages.py"
      - "scripts/generate_author_pages.py"
      - "scripts/generate_share_cards.py"
      - "scripts/generate_skin_pages.py"
      - "scripts/generate_sitemap.py"
      - "scripts/generate_rss.py"
      - "scripts/share_meta.py"
      - "scripts/assets/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the tip of main, not the commit that triggered this run.
      # Runs are serialized by the `pages` concurrency group, so a run that
      # queued behind another one would otherwise build a stale commit and
      # have its rebuild push rejected as non-fast-forward.
      # Full history: addedAt is each skin file's first-commit date, and in a
      # shallow clone git reports the single grafted commit as adding everything
      # (scripts/added_dates.py refuses to cache that, but the dates would be missing).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog.json
        run: |
          # Writes added-dates.json too (committed below); the first run backfills every file.
          python3 scripts/build_catalog.py --output docs/catalog.json
          # Also write to repo root so the app can fetch via raw.githubusercontent.com/…/main/catalog.json
          cp docs/catalog.json catalog.json

      - name: Install Pillow (share cards and image sizes in page tags)
        run: pip install Pillow

      - name: Generate share cards
        run: python3 scripts/generate_share_cards.py

      - name: Generate static system, author & skin pages, sitemap and feed
        run: |
          python3 scripts/generate_system_pages.py
          python3 scripts/generate_author_pages.py
          python3 scripts/generate_skin_pages.py
          python3 scripts/generate_sitemap.py
          python3 scripts/generate_rss.py

      - name: Inject cache-busting hashes into HTML
        run: |
          CSS_VER=$(md5sum docs/style.css | cut -c1-8)
          JS_VER=$(md5sum docs/js/browse.js | cut -c1-8)
          # Idempotent: replaces existing ?v=... or bare filename
          RA_VER=$(cat docs/js/retroarch-page.js docs/js/skin/*.js docs/js/skin/*.json | md5sum | cut -c1-8)
          sed -i "s|href=\"style\.css[^\"]*\"|href=\"style.css?v=$CSS_VER\"|g" docs/index.html docs/submit.html docs/retroarch.html
          sed -i "s|src=\"js/browse\.js[^\"]*\"|src=\"js/browse.js?v=$JS_VER\"|g" docs/index.html
          sed -i "s|src=\"js/retroarch-page\.js[^\"]*\"|src=\"js/retroarch-page.js?v=$RA_VER\"|g" docs/retroarch.html
          echo "CSS hash: $CSS_VER  JS hash: $JS_VER"

      - name: Commit updated catalog and generated pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild catalog + static pages [skip ci]"
          file_pattern: docs/catalog.json docs/catalog.min.json catalog.json added-dates.json docs/creators.json docs/creators/ docs/cards/ docs/s/ docs/systems/ docs/authors/ docs/sitemap.xml docs/feed.xml docs/index.html docs/submit.html docs/retroarch.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --repo ${{ github.repository }} \
            --label "workflow-failure" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Workflow-failure issue #$EXISTING already open — adding this run to it"
            gh issue comment "$EXISTING" --repo ${{ github.repository }} \
              --body "Failed again: run ${{ github.run_number }} ($RUN_URL), trigger \`${{ github.event_name }}\`, commit ${{ github.sha }}."
            exit 0
          fi
          gh issue create \
            --repo ${{ github.repository }} \
            --title "🚨 Build Catalog workflow failed (run ${{ github.run_number }})" \
            --body "The **Build Catalog & Deploy Site** workflow failed.

          **Run:** $RUN_URL
          **Trigger:** \`${{ github.event_name }}\`
          **Commit:** ${{ github.sha }}

          Please investigate the failed step in the run logs. Later failures are added to this issue as comments while it stays open." \
            --assignee JoeMatt \
            --label "bug,workflow-failure"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
