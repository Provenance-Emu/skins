name: Link Health

on:
  # Tuesday 4am UTC — the day after the Monday crawl, so new imports get checked.
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      force:
        description: "Write results even if the circuit breaker trips"
        type: boolean
        default: false
      repack:
        description: "Extract zip packs and publish them to the mirror release"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: link-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Every archive is downloaded once into this directory (scripts/polite_http.py).
      # Repack reuses it, and the archives of skins still missing a thumbnail go to
      # generate-thumbnails.yml as an artifact.
      SKIN_CACHE_DIR: .skin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Last run's downloads, so deltastyles.com gets If-None-Match / If-Modified-Since
      # requests (and answers 304) instead of the same files again. The script prunes
      # the directory to 3 GB before it is saved.
      - name: Restore the download cache
        uses: actions/cache@v4
        with:
          path: .skin-cache
          key: skin-cache-${{ github.run_id }}
          restore-keys: |
            skin-cache-

      - name: Check every download
        id: health
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python3 scripts/link_health.py --export-cache build/skin-export $ARGS

      # The thumbnail job reads these instead of downloading from deltastyles.com again.
      - name: Hand the downloads to the thumbnail job
        if: steps.health.outputs.exported != '' && steps.health.outputs.exported != '0'
        uses: actions/upload-artifact@v4
        with:
          name: skin-cache
          path: build/skin-export
          retention-days: 3
          compression-level: 0

      - name: Repack zip packs into installable skins
        if: steps.health.outputs.repackable != '' && (github.event_name == 'schedule' || inputs.repack)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/repack_skins.py --from-health --upload

      - name: Commit results
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add link-health.json skins/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update link health"
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the catalog rebuild (and thumbnails for repacked skins) explicitly.
      - name: Rebuild catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-catalog.yml --ref main

      # Also runs when nothing changed here: skins can be missing thumbnails
      # regardless, and the artifact above carries their archives.
      - name: Generate thumbnails
        if: steps.commit.outputs.changed == 'true' || (steps.health.outputs.exported != '' && steps.health.outputs.exported != '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_RUN_ID: ${{ github.run_id }}
          HAS_CACHE: ${{ steps.health.outputs.exported != '' && steps.health.outputs.exported != '0' }}
        run: |
          if [ "$HAS_CACHE" = "true" ]; then
            gh workflow run generate-thumbnails.yml --ref main -f cache_run_id="$CACHE_RUN_ID"
          else
            gh workflow run generate-thumbnails.yml --ref main
          fi

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 Link Health workflow failed (run ${{ github.run_number }})" \
            --body "The **Link Health** workflow failed. If the circuit breaker tripped, more than 10% of skins newly failed in one run — check whether a host is down or blocking us before re-running with \`force\`.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger:** \`${{ github.event_name }}\`" \
            --assignee JoeMatt \
            --label "bug,workflow-failure"
