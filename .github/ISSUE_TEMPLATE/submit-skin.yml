name: Submit a Skin
description: Submit a single skin file to the Provenance skin catalog
labels: ["skin-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a Skin to the Provenance Catalog

        Paste a public link to one `.deltaskin` or `.manicskin` file. The bot checks it and replies here.
        You can edit the issue if you need to correct the link.

        For a repo, a release, or a folder of generated variants, use the [collection form](https://github.com/Provenance-Emu/skins/issues/new?template=register-source.yml).
        A maintainer will review the scope and how its layouts and colorways should appear.

  - type: input
    id: skin_url
    attributes:
      label: Skin URL
      description: Public download link for one skin file
      placeholder: "https://github.com/yourname/myskin/raw/main/MySkin.deltaskin"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author / Credit
      description: Your name or handle (as you want it displayed in the catalog)
      placeholder: "yourname"
    validations:
      required: false

  - type: input
    id: thumbnail
    attributes:
      label: Thumbnail URL (optional)
      description: A preview image URL (JPEG or PNG). Makes your skin more discoverable.
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The download URL is publicly accessible (not behind a login)
          required: true
        - label: This skin is compatible with Provenance (`.deltaskin` or `.manicskin` format)
          required: true
        - label: I have the right to submit this skin (it's mine, or open source)
          required: true
