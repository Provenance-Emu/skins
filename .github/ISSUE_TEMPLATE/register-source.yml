name: Add or replace a skin collection
description: Register a repo, import release packs, or replace an existing source
labels: ["source-registration"]
body:
  - type: markdown
    attributes:
      value: |
        ## Add or replace a skin collection

        Share a public GitHub repository and tell us what to import. One request is enough for a generated collection.
        A maintainer will review it. Once registered, new skins can be discovered on the weekly crawl.

        If you're returning after removing a source, include the previous request and the exact repo you want to restore.
        An opt-out stays in effect until a maintainer verifies the owner's request for that source.

  - type: input
    id: repo_url
    attributes:
      label: GitHub Repo URL
      placeholder: "https://github.com/yourname/your-skins"
    validations:
      required: true

  - type: input
    id: attribution
    attributes:
      label: Attribution name
      description: How should your name/handle appear in the catalog for skins from this repo?
      placeholder: "yourname"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Repo description
      description: Brief description of what skins are in this repo
      placeholder: "GBA and SNES skins with dark theme variants"
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: What should we import?
      description: List folders or release tags, the expected number of layouts and files, and any legacy builds to exclude. If the skins are generated, tell us which names or IDs stay stable across updates.
      placeholder: |
        Import the current release tags only. Group colorways under each layout.
        Exclude legacy button mappings. Existing layout IDs stay the same across updates.
    validations:
      required: true

  - type: input
    id: replaces
    attributes:
      label: Previous source or removal request
      description: Leave blank for a new collection. For a replacement or reinstatement, link the old repo or issue.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The repo is public
          required: true
        - label: The repo or its releases contain public skin files or ZIP packs
          required: true
        - label: I own or have rights to distribute these skins
          required: true
